# A Hadoop 3.4 cluster on one machine: one NameNode, one ResourceManager, a JobHistory server, and
# three workers. Each worker runs a DataNode and a NodeManager, as a real worker node does, so a
# map task can read its block on the machine it runs on (data locality), and stopping a worker is
# a node failure. A single daemon can be killed inside a worker for the narrower tests.
#
#   docker compose up -d
#   docker compose run --rm client hdfs dfsadmin -report
#
# The client mounts the built jobs read-only at /jobs and the downloaded data at /input
# ($WH_DATA_DIR, set in the environment or in a local .env file).

x-hadoop: &hadoop
  image: apache/hadoop:3.4.3
  env_file: cluster/hadoop.env
  depends_on:
    volumes:
      condition: service_completed_successfully

services:
  # Named volumes start out owned by root; the daemons run as uid 1000.
  volumes:
    image: apache/hadoop:3.4.3
    user: root
    entrypoint: ["sh", "-c", "chown 1000:100 /v/*"]
    volumes:
      - namenode:/v/namenode
      - worker1:/v/worker1
      - worker2:/v/worker2
      - worker3:/v/worker3

  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /data/name
    volumes: [namenode:/data]
    ports: ["9870:9870"]

  worker1: &worker
    <<: *hadoop
    hostname: worker1
    command: ["bash", "-c", "hdfs --daemon start datanode && exec yarn nodemanager"]
    volumes: [worker1:/data]
  worker2:
    <<: *worker
    hostname: worker2
    volumes: [worker2:/data]
  worker3:
    <<: *worker
    hostname: worker3
    volumes: [worker3:/data]

  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports: ["8088:8088"]

  historyserver:
    <<: *hadoop
    hostname: historyserver
    command: ["mapred", "historyserver"]
    ports: ["19888:19888"]

  client:
    <<: *hadoop
    profiles: [tools]
    volumes:
      - ./mapreduce/target:/jobs:ro
      - ${WH_DATA_DIR:-./data}:/input:ro

volumes:
  namenode:
  worker1:
  worker2:
  worker3:
